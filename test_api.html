<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Тест API — Neonka</title>
    <style>
        body { font-family: sans-serif; max-width: 600px; margin: 40px auto; padding: 0 20px; }
        h2 { margin-top: 30px; }
        form { border: 1px solid #ccc; padding: 15px; border-radius: 8px; margin-bottom: 20px; }
        input, textarea { width: 100%; padding: 8px; margin: 5px 0 10px; box-sizing: border-box; }
        button { padding: 10px 20px; background: #e91e63; color: #fff; border: none; border-radius: 4px; cursor: pointer; }
        button:hover { background: #c2185b; }
        .result { background: #f5f5f5; padding: 10px; border-radius: 4px; white-space: pre-wrap; min-height: 30px; }
    </style>
</head>
<body>
    <h1>Тест API Neonka</h1>

    <h2>1. Регистрация</h2>
    <form id="registerForm">
        <input type="hidden" name="action" value="register">
        <input type="text" name="name" placeholder="Имя" value="Тест Пользователь" required>
        <input type="text" name="phone" placeholder="Телефон" value="+79991234567" required>
        <input type="email" name="email" placeholder="Email" value="test@example.com" required>
        <input type="password" name="password" placeholder="Пароль" value="123456" required>
        <button type="submit">Зарегистрировать</button>
    </form>
    <div class="result" id="registerResult"></div>

    <h2>2. Вход</h2>
    <form id="loginForm">
        <input type="hidden" name="action" value="login">
        <input type="email" name="email" placeholder="Email" value="test@example.com" required>
        <input type="password" name="password" placeholder="Пароль" value="123456" required>
        <button type="submit">Войти</button>
    </form>
    <div class="result" id="loginResult"></div>

    <h2>3. Создать запись</h2>
    <form id="bookingForm">
        <input type="hidden" name="action" value="create_booking">
        <input type="text" name="client_name" placeholder="Имя" value="Тест Клиент" required>
        <input type="text" name="client_phone" placeholder="Телефон" value="+79991234567" required>
        <input type="email" name="client_email" placeholder="Email" value="test@example.com">
        <input type="text" name="service" placeholder="Услуга" value="Маникюр" required>
        <input type="text" name="master" placeholder="Мастер" value="Анна">
        <input type="date" name="booking_date" value="2026-04-10" required>
        <input type="time" name="booking_time" value="14:00" required>
        <textarea name="comment" placeholder="Комментарий">Хочу к 14:00</textarea>
        <button type="submit">Записаться</button>
    </form>
    <div class="result" id="bookingResult"></div>

    <h2>4. Оставить отзыв</h2>
    <form id="reviewForm">
        <input type="hidden" name="action" value="create_review">
        <input type="text" name="client_name" placeholder="Имя" value="Тест Клиент" required>
        <input type="number" name="rating" placeholder="Оценка (1-5)" value="5" min="1" max="5" required>
        <textarea name="review_text" placeholder="Отзыв" required>Отличный сервис, всем рекомендую!</textarea>
        <button type="submit">Отправить отзыв</button>
    </form>
    <div class="result" id="reviewResult"></div>

    <h2>5. GET — Получить записи</h2>
    <button onclick="getBookings()">Получить все записи</button>
    <div class="result" id="getBookingsResult"></div>

    <h2>6. GET — Получить отзывы</h2>
    <button onclick="getReviews()">Получить все отзывы</button>
    <div class="result" id="getReviewsResult"></div>

    <script>
        const API = 'http://localhost/neonka/php';

        // POST
        function post(url, form) {
            fetch(url, { method: 'POST', body: new FormData(form) })
                .then(r => r.json())
                .then(d => {
                    const el = form.parentElement.querySelector('.result');
                    if (el) el.textContent = JSON.stringify(d, null, 2);
                })
                .catch(e => {
                    const el = form.parentElement.querySelector('.result');
                    if (el) el.textContent = 'Ошибка: ' + e;
                });
        }

        document.getElementById('registerForm').addEventListener('submit', function(e) {
            e.preventDefault();
            post(API + '/post.php', this);
        });

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            post(API + '/post.php', this);
        });

        document.getElementById('bookingForm').addEventListener('submit', function(e) {
            e.preventDefault();
            post(API + '/post.php', this);
        });

        document.getElementById('reviewForm').addEventListener('submit', function(e) {
            e.preventDefault();
            post(API + '/post.php', this);
        });

        // GET
        function getBookings() {
            fetch(API + '/get.php?action=get_bookings')
                .then(r => r.json())
                .then(d => document.getElementById('getBookingsResult').textContent = JSON.stringify(d, null, 2))
                .catch(e => document.getElementById('getBookingsResult').textContent = 'Ошибка: ' + e);
        }

        function getReviews() {
            fetch(API + '/get.php?action=get_reviews')
                .then(r => r.json())
                .then(d => document.getElementById('getReviewsResult').textContent = JSON.stringify(d, null, 2))
                .catch(e => document.getElementById('getReviewsResult').textContent = 'Ошибка: ' + e);
        }
    </script>
</body>
</html>
