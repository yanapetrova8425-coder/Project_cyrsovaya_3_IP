<!-- booking.html — страница онлайн-записи (text, tel, email, select, date, time, radio, checkbox, textarea) -->
<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Онлайн-запись в салон красоты Neonka — выберите услугу, мастера и удобное время.">
  <title>Запись — Салон красоты Neonka</title>
  <link rel="icon" href="img/salona.jpg" type="image/jpeg">
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Шапка -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">Neonka</a>
      <nav class="nav">
        <a href="index.html#services">Услуги</a><div class="sep"></div>
        <a href="index.html#offers">Акции</a><div class="sep"></div>
        <a href="index.html#team">Команда</a><div class="sep"></div>
        <a href="services.html">Каталог</a><div class="sep"></div>
        <a href="booking.html">Запись</a><div class="sep"></div>
        <a href="gallery.html">Галерея</a><div class="sep"></div>
        <a href="reviews.html">Отзывы</a><div class="sep"></div>
        <button class="btn-auth btn-in" id="btn-open-login">Вход</button><div class="sep"></div>
        <button class="btn-auth btn-up" id="btn-open-register">Регистрация</button>
      </nav>
    </div>
  </header>

  <!-- Заголовок -->
  <section class="pagehead">
    <div class="container">
      <h1>Онлайн-запись</h1>
      <p>Запишитесь на удобное время за пару минут</p>
    </div>
  </section>

  <!-- Форма записи (novalidate — своя валидация через validation.js) -->
  <section class="booking">
    <div class="container">
      <form class="form" id="booking-form" novalidate method="POST">

        <div class="field">
          <label for="name">Ваше фамилия и имя:</label>
          <input type="text" id="name" name="name" placeholder="Иванова Анна" required>
          <span class="err" id="name-error"></span>
        </div>

        <div class="field">
          <label for="phone">Телефон:</label>
          <input type="tel" id="phone" name="phone" placeholder="+7 (999) 123-45-67" required>
          <span class="err" id="phone-error"></span>
        </div>

        <div class="field">
          <label for="email">Email:</label>
          <input type="email" id="email" name="email" placeholder="example@mail.ru">
          <span class="err" id="email-error"></span>
        </div>

        <div class="field">
          <label for="service">Услуга:</label>
          <select id="service" name="service" required>
            <option value="">— Выберите услугу —</option>
            <optgroup label="Парикмахерский зал">
              <option value="haircut_woman">Стрижка женская</option>
              <option value="haircut_man">Стрижка мужская</option>
              <option value="coloring">Окрашивание полное</option>
              <option value="melirovanie">Мелирование</option>
              <option value="balayazh">Балаяж / Омбре</option>
              <option value="keratin">Кератиновое выпрямление</option>
              <option value="laminating">Ламинирование волос</option>
            </optgroup>
            <optgroup label="Ногтевой сервис">
              <option value="manicure">Маникюр классический</option>
              <option value="manicure_gel">Маникюр + покрытие гель</option>
              <option value="nail_design">Дизайн ногтей</option>
              <option value="pedicure">Педикюр полный</option>
              <option value="pedicure_express">Педикюр экспресс</option>
            </optgroup>
            <optgroup label="Визаж и стиль">
              <option value="makeup_day">Визаж дневной</option>
              <option value="makeup_evening">Визаж вечерний</option>
              <option value="wedding">Свадебный образ</option>
              <option value="styling">Укладка праздничная</option>
            </optgroup>
          </select>
          <span class="err" id="service-error"></span>
        </div>

        <div class="field">
          <label for="master">Мастер:</label>
          <select id="master" name="master">
            <option value="">Любой мастер</option>
            <option value="elena">Елена — парикмахер-стилист</option>
            <option value="marina">Марина — мастер маникюра</option>
            <option value="olga">Ольга — визажист</option>
            <option value="natasha">Наташа — универсальный мастер</option>
          </select>
        </div>

        <div class="field">
          <label for="date">Дата:</label>
          <input type="date" id="date" name="date" required>
          <span class="err" id="date-error"></span>
        </div>

        <div class="field">
          <label for="time">Время:</label>
          <input type="time" id="time" name="time" min="09:00" max="20:00" required>
          <span class="err" id="time-error"></span>
        </div>

        <div class="field">
          <label>Подтверждение записи:</label>
          <div class="radios">
            <label class="radio"><input type="radio" name="confirm" value="phone" checked> По телефону</label>
            <label class="radio"><input type="radio" name="confirm" value="email"> На email</label>
            <label class="radio"><input type="radio" name="confirm" value="Telegram"> Telegram</label>
          </div>
        </div>

        <div class="field">
          <label class="check"><input type="checkbox" id="agree" name="agree" required> Согласен(а) на обработку данных!</label>
          <span class="err" id="agree-error"></span>
        </div>

        <div class="field">
          <label for="comment">Комментарий:</label>
          <textarea id="comment" name="comment" rows="4" placeholder="Пожелания, особенности..."></textarea>
        </div>

        <button type="submit" class="btn btn-dark btn-full">Записаться</button>
        <div class="result" id="booking-result"></div>
      </form>
    </div>
  </section>

  <!-- Подвал -->
  <footer class="footer">
    <div class="container">
      <div class="footer-wrap">
        <div class="flogo">Neonka</div>
        <div class="flinks">
          <a href="index.html#services">Услуги</a><a href="index.html#offers">Акции</a><a href="index.html#team">Команда</a>
          <a href="services.html">Каталог</a><a href="booking.html">Запись</a><a href="gallery.html">Галерея</a>
          <a href="reviews.html">Отзывы</a><a href="account.html">Кабинет</a>
        </div>
        <div class="fsocial">
          <a href="#">VK</a><a href="#">Telegram</a>
        </div>
      </div>
      <div class="fcopy"><p>&copy; 2026 Салон красоты Neonka, Шумерля.</p></div>
    </div>
  </footer>

  <!-- validation.js — валидация регулярными выражениями; main.js — AJAX-отправка через fetch -->
  <script src="js/validation.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
