<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Запись — Салон красоты Neonka</title>
  <link rel="stylesheet" href="style.css">
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

  <!-- Шапка сайта с навигацией -->
  <header class="header">
    <div class="container">
      <a href="index.html" class="logo">Neonka</a>
      <nav class="menu">
        <a href="index.html">Главная</a>
        <a href="services.html">Услуги</a>
        <a href="booking.html">Запись</a>
        <a href="gallery.html">Галерея / Отзывы</a>
        <a href="account.html">Кабинет</a>
      </nav>
    </div>
  </header>

  <!-- Заголовок страницы -->
  <section class="page_hero">
    <div class="container">
      <h1>Онлайн-запись</h1>
      <p>Запишитесь на удобное время за пару минут</p>
    </div>
  </section>

  <!-- Форма записи -->
  <section class="booking_section">
    <div class="container">
      <form class="booking_form" id="booking-form" novalidate>

        <!-- Поле: имя (text) -->
        <div class="form_group">
          <label for="client-name">Ваше имя *</label>
          <input type="text" id="client-name" name="client_name" placeholder="Иванова Анна" required>
          <span class="error_message" id="name-error"></span>
        </div>

        <!-- Поле: телефон (tel) -->
        <div class="form_group">
          <label for="client-phone">Телефон *</label>
          <input type="tel" id="client-phone" name="client_phone" placeholder="+7 (999) 123-45-67" required>
          <span class="error_message" id="phone-error"></span>
        </div>

        <!-- Поле: email (email) -->
        <div class="form_group">
          <label for="client-email">Email</label>
          <input type="email" id="client-email" name="client_email" placeholder="example@mail.ru">
          <span class="error_message" id="email-error"></span>
        </div>

        <!-- Поле: выбор услуги (select) -->
        <div class="form_group">
          <label for="service-select">Услуга *</label>
          <select id="service-select" name="service" required>
            <option value="">— Выберите услугу —</option>
            <optgroup label="Парикмахерский зал">
              <option value="haircut_woman">Стрижка женская</option>
              <option value="haircut_man">Стрижка мужская</option>
              <option value="coloring">Окрашивание полное</option>
              <option value="melirovanie">Мелирование</option>
              <option value="balayazh">Балаяж / Омбре</option>
            </optgroup>
            <optgroup label="Ногтевой сервис">
              <option value="manicure">Маникюр классический</option>
              <option value="manicure_gel">Маникюр + покрытие гель</option>
              <option value="nail_design">Дизайн ногтей</option>
              <option value="pedicure">Педикюр полный</option>
              <option value="pedicure_express">Педикюр экспресс</option>
            </optgroup>
            <optgroup label="Визаж и стиль">
              <option value="makeup_day">Визаж дневной</option>
              <option value="makeup_evening">Визаж вечерний</option>
              <option value="wedding">Свадебный образ</option>
              <option value="styling">Укладка праздничная</option>
            </optgroup>
          </select>
          <span class="error_message" id="service-error"></span>
        </div>

        <!-- Поле: выбор мастера (select) -->
        <div class="form_group">
          <label for="master-select">Мастер</label>
          <select id="master-select" name="master">
            <option value="">Любой мастер</option>
            <option value="elena">Елена — парикмахер-стилист</option>
            <option value="marina">Марина — мастер маникюра</option>
            <option value="olga">Ольга — визажист</option>
            <option value="natasha">Наташа — универсальный мастер</option>
          </select>
        </div>

        <!-- Поле: дата (date) -->
        <div class="form_group">
          <label for="booking-date">Дата *</label>
          <input type="date" id="booking-date" name="booking_date" required>
          <span class="error_message" id="date-error"></span>
        </div>

        <!-- Поле: время (time) -->
        <div class="form_group">
          <label for="booking-time">Время *</label>
          <input type="time" id="booking-time" name="booking_time" min="09:00" max="20:00" required>
          <span class="error_message" id="time-error"></span>
        </div>

        <!-- Поле: способ подтверждения (radio) -->
        <div class="form_group">
          <label>Подтверждение записи</label>
          <div class="radio_group">
            <label class="radio_label">
              <input type="radio" name="confirm_method" value="phone" checked>
              По телефону
            </label>
            <label class="radio_label">
              <input type="radio" name="confirm_method" value="email">
              На email
            </label>
            <label class="radio_label">
              <input type="radio" name="confirm_method" value="whatsapp">
              WhatsApp
            </label>
          </div>
        </div>

        <!-- Поле: согласие (checkbox) -->
        <div class="form_group">
          <label class="checkbox_label">
            <input type="checkbox" id="agree-terms" name="agree_terms" required>
            Согласен(а) на обработку персональных данных *
          </label>
          <span class="error_message" id="agree-error"></span>
        </div>

        <!-- Поле: комментарий (textarea) -->
        <div class="form_group">
          <label for="client-comment">Комментарий</label>
          <textarea id="client-comment" name="comment" rows="4" placeholder="Пожелания, особенности..."></textarea>
        </div>

        <button type="submit" class="btn btn_primary btn_full">Записаться</button>
        <div class="form_result" id="booking-result"></div>
      </form>
    </div>
  </section>

  <!-- Подвал сайта -->
  <footer class="footer">
    <div class="container">
      <div class="footer_content">
        <div class="footer_logo">Neonka</div>
        <div class="footer_links">
          <a href="index.html">Главная</a>
          <a href="services.html">Услуги</a>
          <a href="booking.html">Запись</a>
          <a href="gallery.html">Галерея / Отзывы</a>
          <a href="account.html">Кабинет</a>
        </div>
        <div class="footer_social">
          <a href="#">VK</a>
          <a href="#">Telegram</a>
        </div>
      </div>
      <div class="footer_bottom">
        <p>&copy; 2026 Салон красоты Neonka, Шумерля.</p>
      </div>
    </div>
  </footer>

  <!-- Подключаю свои скрипты -->
  <script src="js/validation.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
